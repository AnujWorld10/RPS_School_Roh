name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: school_db_test
          MYSQL_USER: school_user
          MYSQL_PASSWORD: school_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app
      - name: Run migrations
        env:
          DATABASE_URL: mysql+pymysql://school_user:school_pass@127.0.0.1:3306/school_db_test
          JWT_SECRET_KEY: test-secret-key-32chars-minimum
        run: alembic upgrade head
      - name: Tests
        env:
          DATABASE_URL: mysql+pymysql://school_user:school_pass@127.0.0.1:3306/school_db_test
          JWT_SECRET_KEY: test-secret-key-32chars-minimum
        run: pytest
