# Optional: run MySQL in Docker instead of local MySQL.
# If you already use local MySQL on port 3306, do NOT start the db service —
# run only the API locally: uvicorn app.main:app --reload
services:
  db:
    image: mysql:8.4
    container_name: school_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env or the environment}
      MYSQL_DATABASE: school_db
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - school_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: school_api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Uses Docker MySQL service (not host localhost)
      DATABASE_URL: mysql+pymysql://root:mysql@db:3306/school_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  school_mysql_data:
