# Optional: run MySQL in Docker instead of local MySQL.
# If you already use local MySQL on port 3306, do NOT start the db service â€”
# run only the API locally: uvicorn app.main:app --reload
services:
  db:
    image: mysql:8.4
    container_name: school_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env or the environment}
      MYSQL_DATABASE: school_db
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - school_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: school_api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Uses Docker MySQL service (not host localhost)
      DATABASE_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/school_db"
    ports:
      - "8000:8000"
    volumes:
      - school_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles:
      - release
    env_file:
      - ../.env
    environment:
      DATABASE_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/school_db"
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

volumes:
  school_mysql_data:
  school_uploads:
